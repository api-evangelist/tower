source: https://docs.tower.dev/docs/reference/mcp-server
description: 'Tower ships an official first-party MCP server as part of the Tower CLI (pip install tower
  / uvx tower). It runs locally against your authenticated Tower session and supports three transports:
  stdio (recommended; the AI tool spawns `tower mcp-server` directly), streamable HTTP (http://127.0.0.1:34567/mcp),
  and legacy SSE (http://127.0.0.1:34567/sse). Tower also publishes a Claude Code plugin (tower-cli repo,
  plugin/ dir with .mcp.json) and documents one-click installs for Cursor, VS Code, Gemini CLI, Windsurf,
  and Zed. Tool list captured verbatim from the MCP server reference.'
server:
  name: tower
  transport: stdio
  command: tower mcp-server
  install: pip install tower
  alt_install: uvx tower mcp-server
  auth: Tower CLI session (tower login)
  http: tower mcp-server --transport http --port 34567
  sse: tower mcp-server --transport sse --port 34567
  claude_code: claude mcp add tower -- tower mcp-server
  plugin: https://github.com/tower/tower-cli/tree/main/plugin
docs:
- https://docs.tower.dev/docs/reference/mcp-server
- https://docs.tower.dev/docs/getting-started/quickstart-with-mcp
