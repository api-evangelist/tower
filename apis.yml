aid: tower
name: Tower
description: >-
  Tower is a Python-native data flow orchestrator and fully-managed data
  backend for pipelines, agents, and data applications, pairing serverless (or
  self-hosted) Python compute with an open Apache Iceberg-based lakehouse that
  is compatible with Snowflake, Spark, and DuckDB. Teams deploy versioned
  apps with a Towerfile, run dbt Core and dlt ingestion pipelines, schedule
  and observe runs, and power data agents grounded in fresh company data.
  Founded by engineers from Snowflake, Databricks, Google Cloud Dataflow, and
  Puppet, and backed by Speedinvest, Tower ships a REST API, a CLI, a Python
  SDK, an official MCP server, and provider-published agent skills.
url: https://raw.githubusercontent.com/api-evangelist/tower/refs/heads/main/apis.yml
