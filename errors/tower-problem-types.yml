description: >-
  Error catalog derived from the 4xx/5xx responses in Tower's OpenAPI 3.1
  spec. Tower returns RFC 9457 Problem Details: error responses are typed
  ErrorModel and are served as application/problem+json (default error
  responses also appear as application/json on some operations). ErrorModel
  carries $schema (a URL to the JSON Schema for the object, e.g.
  https://api.tower.dev/v1/schemas/ErrorModel.json), type, title, status,
  detail, instance, and an optional errors[] array of ErrorDetail items
  (message/location/value) for per-field validation problems. Additionally,
  API-key authorization failures return 403 when the key lacks the required
  scope (documented at https://docs.tower.dev/docs/using-tower/api-keys).
